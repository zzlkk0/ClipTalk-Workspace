<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享文件</title><link rel="stylesheet" href="/pages.css"><script src="/ui.js" defer></script><script src="/share.js" defer></script></head><body>
<header><a class="brand" href="/">⚡ <span data-site-name>共享工作区</span></a><a href="/sharing.html" data-t="sharing.title">文件共享</a><button id="language-button">中文 / EN</button></header>
<main class="share-detail"><p id="page-notice" class="notice" role="status" hidden></p><section id="share-content" class="card" hidden><h1 id="share-name"></h1><p id="share-meta" class="muted"></p><p id="share-access"></p><div class="actions"><a id="share-download" class="button primary" data-t="workspace.download">下载</a><button id="share-import" data-t="sharing.import" hidden>接收到我的空间</button><a id="share-login" class="button" data-t="login.btn_login" hidden>登录</a></div><p class="hint" data-t="sharing.copy_hint">接收文件会复制到接收者的空间并计入其容量。取消分享不会删除已接收的副本。</p></section><a id="private-share-login" class="button primary" data-t="sharing.login_view" hidden>登录后查看</a></main>
</body></html>
