<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件共享</title><link rel="stylesheet" href="/pages.css"><script src="/ui.js" defer></script><script src="/sharing.js" defer></script></head><body>
<header><a class="brand" href="/">⚡ <span data-site-name>共享工作区</span></a><a href="/" data-t="admin.back_to_workspace">返回工作区</a><a id="sharing-account" href="/account.html"></a><button id="language-button">中文 / EN</button></header>
<main><h1 data-t="sharing.title">文件共享</h1><p class="muted" data-t="sharing.hint">公开分享允许任何持有链接的人下载；指定用户分享仅允许所选账号访问。</p><p id="page-notice" class="notice" role="status" hidden></p>
<section class="card"><h2 data-t="sharing.receive_link">输入分享链接</h2><form id="share-link-form" class="inline-form"><input id="share-link-input" type="text" required data-t-placeholder="sharing.link_placeholder" placeholder="粘贴本站分享链接"><button class="primary" data-t="sharing.open_link">打开分享</button></form></section>
<section class="card"><h2 data-t="sharing.create">共享我的文件</h2><form id="share-create-form"><div class="form-grid"><div><label for="share-file" data-t="sharing.select_file">选择文件（含归档文件）</label><select id="share-file" required></select></div><div><label for="share-visibility" data-t="sharing.visibility">访问权限</label><select id="share-visibility"><option value="users" data-t="sharing.users">指定用户</option><option value="public" data-t="sharing.public">公开（Public）</option></select></div></div><div id="share-recipients-section"><label data-t="sharing.select_users">选择接收用户</label><div id="share-recipients" class="recipients"></div></div><div class="actions"><button id="create-share-button" type="submit" class="primary" data-t="sharing.create_button">创建分享链接</button></div><p class="hint" data-t="sharing.copy_hint">接收文件会复制到接收者的空间并计入其容量。取消分享不会删除已接收的副本。</p></form></section>
<div class="tabs"><button type="button" class="active" data-filter="mine" data-t="sharing.mine">我的分享</button><button type="button" data-filter="received" data-t="sharing.received">分享给我</button><button type="button" data-filter="public" data-t="sharing.public_list">公开文件</button><button id="refresh-shares" type="button" data-t="sharing.refresh">刷新</button></div><div id="share-list" class="share-list"></div>
</main>
<dialog id="share-edit-dialog"><div class="dialog-header"><h2 data-t="sharing.edit">修改分享权限</h2><button id="close-share-edit" type="button" data-t="workspace.close">关闭</button></div><form id="share-edit-form"><label for="edit-share-visibility" data-t="sharing.visibility">访问权限</label><select id="edit-share-visibility"><option value="users" data-t="sharing.users">指定用户</option><option value="public" data-t="sharing.public">公开（Public）</option></select><div id="edit-recipients-section"><label data-t="sharing.select_users">选择接收用户</label><div id="edit-share-recipients" class="recipients"></div></div><div class="actions"><button class="primary" data-t="admin.btn_save">保存</button></div><p id="edit-share-error" class="error" role="alert"></p></form></dialog>
</body></html>
