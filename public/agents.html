<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 接入</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><link rel="stylesheet" href="/pages.css"><script src="/ui.js" defer></script><script src="/agents.js" defer></script>
<style>.key-scopes{display:flex;flex-wrap:wrap;gap:8px 18px}.key-scopes label{margin:4px 0}.key-scopes input{width:auto;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--input);padding:14px;border-radius:8px;font-size:12px}.key-row{padding:14px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.key-row h3{margin:0}.audit-wrap{overflow-x:auto}table{min-width:540px;width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);overflow-wrap:anywhere}#new-token{font-family:monospace}#agent-setup{max-width:100%}</style></head><body>
<header><a class="brand" href="/">⚡ <span data-site-name>共享工作区</span></a><a href="/account.html" data-t="account.title">我的账号</a><button class="theme-toggle" data-theme-toggle hidden></button><button id="language-button">中文 / EN</button></header>
<main><h1 data-t="agents.title">Agent 接入</h1><p class="muted" data-t="agents.hint"></p><p id="page-notice" class="notice" role="status" hidden></p>
<section class="card"><h2 data-t="agents.create"></h2><p id="transport-hint" class="notice" hidden data-t="agents.transport_hint"></p>
<form id="key-form"><div class="form-grid"><div><label for="key-label" data-t="agents.label"></label><input id="key-label" maxlength="80" required autocomplete="off"></div><div><label for="key-days" data-t="agents.expiry"></label><input id="key-days" type="number" min="1" max="365" value="30" required></div></div>
<p data-t="agents.permissions"></p><div id="key-scopes" class="key-scopes"></div><label for="key-password" data-t="account.current_password"></label><input id="key-password" type="password" required autocomplete="current-password"><div class="actions"><button type="submit" class="primary" data-t="agents.create"></button></div></form>
<div id="created-key" hidden><p data-t="agents.show_once"></p><input id="new-token" readonly aria-label="API key"><div class="actions"><button id="copy-token" data-t="agents.copy"></button><button id="hide-token" data-t="agents.hide"></button></div></div></section>
<section class="card"><h2 data-t="agents.keys"></h2><div id="key-list"></div></section>
<section class="card" id="agent-setup"><h2 data-t="agents.setup"></h2><p data-t="agents.setup_hint"></p><a href="https://github.com/zzlkk0/ClipTalk-Workspace/blob/main/docs/AGENTS_API.md" target="_blank" rel="noreferrer" data-t="agents.guide"></a><p data-t="agents.config_hint"></p><pre id="mcp-config"></pre><p data-t="agents.local_files_hint"></p></section>
<section class="card"><h2 data-t="agents.audit"></h2><p class="muted" data-t="agents.audit_hint"></p><button id="audit-refresh" data-t="drive.refresh"></button><div class="audit-wrap"><table><thead><tr><th data-t="agents.time"></th><th data-t="agents.label"></th><th data-t="agents.action"></th><th data-t="agents.target"></th><th data-t="agents.result"></th></tr></thead><tbody id="audit-list"></tbody></table></div><button id="audit-more" hidden data-t="agents.more"></button></section>
</main></body></html>
