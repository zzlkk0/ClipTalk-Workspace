<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理面板</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f0f14;--card:#1a1a24;--border:#2a2a3a;--text:#d0d0dc;
    --dim:#707088;--accent:#6c8cff;--green:#50d890;--red:#ff6b7a;
    --amber:#f0c060;--input:#14141e;--hover:#252535;
  }
  body{
    font-family:-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
  }
  /* ── 顶栏 ── */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:12px 24px;
    background:var(--card);border-bottom:1px solid var(--border);
  }
  .topbar .logo{font-weight:700;font-size:16px;color:var(--accent)}
  .topbar .spacer{flex:1}
  .topbar a{
    color:var(--text);text-decoration:none;font-size:13px;
    padding:6px 14px;border-radius:6px;transition:all .15s;
  }
  .topbar a:hover{background:var(--hover)}
  .topbar a.danger{color:var(--red)}
  .topbar a.danger:hover{background:rgba(255,107,122,.1)}
  /* ── 统计卡片 ── */
  .stats-row{
    display:flex;gap:16px;padding:24px;max-width:900px;margin:0 auto;
  }
  .stat-card{
    flex:1;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:20px;text-align:center;
  }
  .stat-card .num{font-size:32px;font-weight:700;color:var(--accent)}
  .stat-card .num.green{color:var(--green)}
  .stat-card .num.amber{color:var(--amber)}
  .stat-card .label{font-size:12px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  /* ── 内容区 ── */
  .container{max-width:1100px;margin:0 auto;padding:0 24px 40px}
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;overflow:hidden;margin-bottom:20px;
  }
  .card-header{
    padding:14px 20px;font-size:13px;font-weight:600;color:var(--dim);
    border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px;
  }
  /* ── 表格 ── */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--input)}
  td{padding:10px 16px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--hover)}
  .badge{font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600}
  .badge-admin{background:rgba(108,140,255,.2);color:var(--accent)}
  .badge-user{background:rgba(112,112,136,.2);color:var(--dim)}
  .badge-active{background:rgba(80,216,144,.2);color:var(--green)}
  .badge-disabled{background:rgba(255,107,122,.2);color:var(--red)}
  .badge-pending{background:rgba(240,192,96,.2);color:var(--amber)}
  /* ── 按钮 ── */
  .btn{
    padding:4px 12px;border:1px solid var(--border);background:var(--hover);
    color:var(--text);border-radius:5px;cursor:pointer;font-size:12px;
    margin:2px;transition:all .15s;
  }
  .btn:hover{opacity:.85}
  .btn-ok{border-color:var(--green);color:var(--green)}
  .btn-ok:hover{background:var(--green);color:#fff}
  .btn-warn{border-color:var(--amber);color:var(--amber)}
  .btn-warn:hover{background:var(--amber);color:#fff}
  .btn-del{border-color:var(--red);color:var(--red)}
  .btn-del:hover{background:var(--red);color:#fff}
  /* ── 设置表单 ── */
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;border-bottom:1px solid var(--border);
  }
  .setting-row:last-child{border-bottom:none}
  .setting-row label{font-size:13px}
  .toggle-group{display:flex;gap:4px}
  .toggle{
    padding:5px 14px;border:1px solid var(--border);background:transparent;
    color:var(--dim);cursor:pointer;font-size:12px;transition:all .15s;
  }
  .toggle:first-child{border-radius:6px 0 0 6px}
  .toggle:last-child{border-radius:0 6px 6px 0}
  .toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toggle.on.green{background:var(--green);border-color:var(--green)}
  .input-line{display:flex;gap:10px;align-items:center;padding:16px 20px}
  .input-line input{
    flex:1;padding:8px 12px;border:1px solid var(--border);
    background:var(--input);color:var(--text);border-radius:6px;
    font-size:13px;outline:none;max-width:220px;
  }
  .input-line input:focus{border-color:var(--accent)}
  .toast{font-size:12px;margin-left:12px;min-width:80px}
  .toast.ok{color:var(--green)} .toast.err{color:var(--red)}
  /* ── 加载/错误 ── */
  .center-msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px}
  .center-msg.err{color:var(--red)}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .table-scroll{overflow-x:auto}
  .quota-input{width:100px;padding:6px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:5px}
  .storage-hint{color:var(--dim);font-size:12px;padding:10px 20px;line-height:1.6}
  .storage-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .storage-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 20px}
  .storage-summary b{display:block;font-size:20px;color:var(--accent);overflow-wrap:anywhere}
  .storage-summary span{font-size:12px;color:var(--dim)}
  .storage-progress{width:100px;height:8px;accent-color:var(--accent);display:block;margin-top:4px}
  .storage-progress.over{accent-color:var(--red)}
  .admin-create{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:16px 20px}
  .admin-create label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  .admin-create input{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;max-width:100%}
  .admin-create .field{flex:1;min-width:180px}
  .admin-create .btn{padding:8px 12px}
  .inline-notice{font-size:12px;margin:0 20px 16px;color:var(--green)}
  .inline-notice.err{color:var(--red)}
  @media(max-width:700px){.topbar{flex-wrap:wrap;padding:12px}.container{padding:0 12px 24px}.stats-row{padding:12px;gap:8px}.stat-card{padding:12px}.input-line{flex-wrap:wrap}}
  @media(max-width:700px){.storage-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-create input{width:100%}}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">⚙️ <span data-site-name>共享工作区</span> · 管理面板</span>
  <span id="top-stats" style="color:var(--dim);font-size:13px"></span>
  <span class="spacer"></span>
  <a id="my-account-link" href="/account.html">我的账号</a>
  <a href="#storage-panel">用户存储</a>
  <button class="theme-toggle" data-theme-toggle hidden></button>
  <a href="/">← 返回工作区</a>
  <a href="/" class="danger" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login.html');return false">退出登录</a>
</div>

<div id="app"><div class="center-msg"><span class="spin"></span>加载中...</div></div>

<script src="/ui.js"></script>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
let myId='';

async function load(){
  const app=document.getElementById('app');
  try{
    const me=await ClipTalkUI.init('admin.heading');
    myId=me.id;
    document.getElementById('my-account-link').textContent='我的账号 · '+me.username;
    const [uResp,sResp,setResp,storageResp]=await Promise.all([
      fetch('/api/admin/users'),fetch('/api/admin/stats'),fetch('/api/admin/settings'),fetch('/api/admin/storage')
    ]);
    if(!uResp.ok)throw new Error('请求被拒 (HTTP '+uResp.status+')，请确认已用管理员账号登录');
    const users=await uResp.json();
    const stats=await sResp.json();
    const settings=await setResp.json();
    ClipTalkUI.updateSite({siteName:settings.site_name});
    ClipTalkUI.applyBrand('共享工作区','管理面板');
    if(!storageResp.ok)throw new Error('无法读取容量设置');
    const storage=await storageResp.json();

    document.getElementById('top-stats').textContent=
      '用户 '+stats.total+'  |  活跃 '+stats.active+'  |  待审批 '+stats.pending;

    var h='';

    // 统计卡片
    h+='<div class="stats-row">';
    h+='<div class="stat-card"><div class="num">'+stats.total+'</div><div class="label">用户总数</div></div>';
    h+='<div class="stat-card"><div class="num green">'+stats.active+'</div><div class="label">活跃用户</div></div>';
    h+='<div class="stat-card"><div class="num amber">'+stats.pending+'</div><div class="label">待审批</div></div>';
    h+='</div><div class="container">';

    // 用户表格
    h+='<div class="card">';
    h+='<div class="card-header">👥 用户管理</div>';
    if(users.length===0){
      h+='<div class="center-msg">暂无用户</div>';
    }else{
      h+='<div class="table-scroll"><table id="user-table"><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
      users.forEach(function(u){
        var time=new Date(u.created_at).toLocaleString('zh-CN');
        h+='<tr>';
        h+='<td><b>'+esc(u.username)+'</b></td>';
        h+='<td><span class="badge badge-'+u.role+'">'+u.role+'</span></td>';
        h+='<td><span class="badge badge-'+u.status+'">'+u.status+'</span></td>';
        h+='<td style="font-size:11px;color:var(--dim)">'+time+'</td>';
        h+='<td>';
        if(u.role!=='admin'){
          if(u.status==='pending'){
            h+='<button class="btn btn-ok" onclick="act(\''+u.id+'\',\'approve\')">✓ 通过</button>';
            h+='<button class="btn btn-del" onclick="act(\''+u.id+'\',\'reject\')">✕ 拒绝</button>';
          }else if(u.status==='active'){
            h+='<button class="btn btn-ok" data-promote-user="'+u.id+'" onclick="promoteUser(\''+u.id+'\')">设为管理员</button>';
            h+='<button class="btn btn-warn" onclick="act(\''+u.id+'\',\'disable\')">禁用</button>';
            h+='<button class="btn btn-del" onclick="act(\''+u.id+'\',\'delete\')">删除</button>';
          }else{
            h+='<button class="btn btn-ok" onclick="act(\''+u.id+'\',\'enable\')">启用</button>';
            h+='<button class="btn btn-del" onclick="act(\''+u.id+'\',\'delete\')">删除</button>';
          }
        }else{
          if(u.id===myId)h+='<a class="btn" href="/account.html">修改本账号</a>';
          if(u.builtin_admin)h+='<span style="color:var(--dim);font-size:11px">默认管理员 · 不可改名、删除或取消权限</span>';
          else if(u.id!==myId)h+='<button class="btn btn-warn" data-demote-user="'+u.id+'" onclick="demoteUser(\''+u.id+'\')">取消管理员权限</button>';
        }
        h+='</td></tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';

    h+='<div class="card"><div class="card-header">添加管理员</div>';
    h+='<p class="storage-hint">创建管理员账号，或在上方把有效用户设为管理员，也可取消其他管理员的权限并保留其账号和数据。默认管理员不能改名、删除或取消权限；新增管理员可以修改名称，系统会保留至少一个有效管理员。</p>';
    h+='<form id="create-admin-form" class="admin-create" onsubmit="createAdmin(event)"><div class="field"><label for="new-admin-username">新管理员用户名</label><input id="new-admin-username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_-]{3,20}" autocomplete="off"></div><div class="field"><label for="new-admin-password">初始密码</label><input id="new-admin-password" type="password" required minlength="6" maxlength="72" autocomplete="new-password"></div><button class="btn btn-ok" type="submit">添加管理员</button></form><p id="admin-create-msg" class="inline-notice" role="status"></p></div>';

    // Per-account quotas: admin can see usage and set a limit, without reading content.
    h+='<div class="card" id="storage-panel"><div class="card-header storage-title"><span>💾 用户存储使用情况</span><button class="btn" id="refresh-storage" onclick="refreshStorage()">刷新用量</button></div>';
    h+='<div class="storage-summary"><div><b id="total-storage-used"></b><span>总使用空间</span></div><div><b id="total-storage-quota"></b><span>账号额度合计</span></div><div><b id="total-storage-files"></b><span>文件占用（含归档）</span></div><div><b id="total-storage-text"></b><span>对话和剪贴板占用</span></div></div>';
    h+='<p class="storage-hint">每个账号默认 1024 MB（1 GB）。当前文件、归档文件、剪贴板和对话文字合计计入用量；归档不会释放容量。降低限额不会删除现有内容。</p>';
    h+='<div class="table-scroll"><table id="storage-table"><thead><tr><th>用户名</th><th>已用空间 / 使用率</th><th>剩余空间</th><th>文件 / 文字</th><th>上限（MB）</th><th>操作</th></tr></thead><tbody>';
    storage.forEach(function(u){
      h+='<tr data-storage-user="'+esc(u.username)+'" data-storage-id="'+u.id+'"><td><b>'+esc(u.username)+'</b></td>';
      h+='<td><span data-storage-used></span><br><small data-storage-percent></small><progress class="storage-progress" data-storage-progress max="100" value="0" aria-label="'+esc(u.username)+' 空间使用率"></progress></td>';
      h+='<td data-storage-remaining></td><td data-storage-breakdown></td>';
      h+='<td><input class="quota-input" id="quota-'+u.id+'" type="number" min="1" max="1048576" step="1" value="'+(u.quotaBytes/1048576)+'" aria-label="'+esc(u.username)+' 容量上限 MB"></td>';
      h+='<td><button class="btn btn-ok" onclick="saveQuota(\''+u.id+'\')">保存容量</button><span class="toast" id="quota-msg-'+u.id+'"></span></td></tr>';
    });
    h+='</tbody></table></div></div>';

    // 系统设置
    h+='<div class="card">';
    h+='<div class="card-header">⚡ 系统设置</div>';
    h+='<div class="input-line"><label for="site-name">网站名称</label><input id="site-name" maxlength="80" placeholder="共享工作区（默认）"><button class="btn btn-ok" id="save-site-name" onclick="saveSiteName()">保存名称</button><span id="site-name-msg" class="toast"></span></div>';
    h+='<div class="setting-row">';
    h+='<label>审批模式</label>';
    h+='<div class="toggle-group">';
    h+='<button class="toggle'+(settings.approval_mode==='auto'?' on green':'')+'" onclick="setSetting(\'auto\')">自动通过</button>';
    h+='<button class="toggle'+(settings.approval_mode==='manual'?' on':'')+'" onclick="setSetting(\'manual\')">手动审批</button>';
    h+='</div></div>';
    h+='<div class="setting-row">';
    h+='<label>开放注册</label>';
    h+='<div class="toggle-group">';
    h+='<button class="toggle'+(settings.registration_enabled==='true'?' on green':'')+'" onclick="setReg(true)">开启</button>';
    h+='<button class="toggle'+(settings.registration_enabled!=='true'?' on':'')+'" onclick="setReg(false)">关闭</button>';
    h+='</div></div>';
    h+='<div class="input-line">';
    h+='<label style="font-size:13px;min-width:80px">修改密码</label>';
    h+='<input id="cur-pwd" type="password" placeholder="当前密码">';
    h+='<input id="new-pwd" type="password" placeholder="新密码">';
    h+='<button class="btn btn-ok" onclick="changePwd()">修改</button>';
    h+='<span id="pwd-msg" class="toast"></span>';
    h+='</div></div>';

    h+='</div>';
    app.innerHTML=h;
    document.getElementById('site-name').value=settings.site_name||'';
    renderStorage(storage);
  }catch(e){
    app.innerHTML='<div class="center-msg err">⚠ 加载失败: '+esc(e.message)+'</div>';
  }
}
async function saveSiteName(){
  const message=document.getElementById('site-name-msg');
  try{
    const site_name=document.getElementById('site-name').value.trim();
    const response=await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_name})});
    if(!response.ok)throw new Error('网站名称最多80个字符，不能包含控制字符');
    ClipTalkUI.updateSite({siteName:site_name});message.textContent='已保存';message.style.color='var(--green)';
  }catch(error){message.textContent=error.message;message.style.color='var(--red)';}
}

function formatBytes(bytes){return ClipTalkUI.size(bytes)}
function renderStorage(storage){
  const total={usedBytes:0,quotaBytes:0,fileBytes:0,textBytes:0};
  storage.forEach(u=>{
    for(const key of Object.keys(total))total[key]+=u[key];
    const row=[...document.querySelectorAll('[data-storage-id]')].find(row=>row.dataset.storageId===u.id);
    if(!row)return;
    const percent=u.usedBytes/u.quotaBytes*100;
    const used=row.querySelector('[data-storage-used]');used.textContent=formatBytes(u.usedBytes);used.style.color=percent>=100?'var(--red)':'';
    row.querySelector('[data-storage-percent]').textContent=(percent>0&&percent<.1?'<0.1':percent.toFixed(1))+'%';
    row.querySelector('[data-storage-remaining]').textContent=formatBytes(u.availableBytes);
    row.querySelector('[data-storage-breakdown]').textContent=formatBytes(u.fileBytes)+' / '+formatBytes(u.textBytes);
    const progress=row.querySelector('[data-storage-progress]');progress.value=Math.min(100,percent);progress.classList.toggle('over',percent>=100);
  });
  for(const [key,id] of [['usedBytes','used'],['quotaBytes','quota'],['fileBytes','files'],['textBytes','text']])document.getElementById('total-storage-'+id).textContent=formatBytes(total[key]);
}
async function refreshStorage(){
  const button=document.getElementById('refresh-storage');button.disabled=true;
  try{renderStorage(await ClipTalkUI.api('/api/admin/storage'))}
  catch(error){alert(ClipTalkUI.error(error.message))}
  finally{button.disabled=false}
}
async function createAdmin(event){
  event.preventDefault();const form=event.target,button=form.querySelector('button'),message=document.getElementById('admin-create-msg');
  button.disabled=true;
  try{
    await ClipTalkUI.api('/api/admin/administrators',ClipTalkUI.json('POST',{username:document.getElementById('new-admin-username').value.trim(),password:document.getElementById('new-admin-password').value}));
    await load();document.getElementById('admin-create-msg').textContent='管理员已创建，可以用新账号登录。';
  }catch(error){message.textContent=ClipTalkUI.error(error.message);message.className='inline-notice err'}
  finally{button.disabled=false}
}
async function promoteUser(id){
  if(!confirm('确定将此用户设为管理员？该用户将可以管理账号和系统设置。'))return;
  try{await ClipTalkUI.api('/api/admin/users/'+encodeURIComponent(id)+'/promote',{method:'POST'});await load()}
  catch(error){alert(ClipTalkUI.error(error.message))}
}
async function demoteUser(id){
  if(!confirm('确定取消此账号的管理员权限？账号会恢复为普通用户，原有文件、对话、归档和容量设置都会保留。'))return;
  try{await ClipTalkUI.api('/api/admin/users/'+encodeURIComponent(id)+'/demote',{method:'POST'});await load()}
  catch(error){alert(ClipTalkUI.error(error.message))}
}
async function saveQuota(id){
  const input=document.getElementById('quota-'+id),message=document.getElementById('quota-msg-'+id);
  const megabytes=Number(input.value);
  if(!input.reportValidity()||!Number.isInteger(megabytes)||megabytes<1){message.textContent='请输入整数 MB';message.className='toast err';return}
  try{
    const response=await fetch('/api/admin/users/'+encodeURIComponent(id)+'/quota',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({quotaBytes:megabytes*1048576})});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'保存失败');
    message.textContent='✓ 已保存';message.className='toast ok';
    await refreshStorage();
  }catch(error){message.textContent=error.message;message.className='toast err'}
}
async function act(id,action){
  if(action==='delete'&&!confirm('确定删除该用户？此操作不可撤销。'))return;
  if(action==='reject'&&!confirm('确定拒绝该用户？'))return;
  var url='/api/admin/users/'+id+(action==='approve'?'/approve':action==='reject'?'/reject':action==='disable'||action==='enable'?'/status':'');
  var method=action==='delete'?'DELETE':'POST';
  var body=(action==='disable'||action==='enable')?JSON.stringify({status:action==='disable'?'disabled':'active'}):undefined;
  await fetch(url,{method:method,headers:body?{'Content-Type':'application/json'}:undefined,body:body});
  load();
}

async function setSetting(mode){
  await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_mode:mode})});
  load();
}

async function setReg(on){
  await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registration_enabled:on})});
  load();
}

async function changePwd(){
  var cur=document.getElementById('cur-pwd').value;
  var pw=document.getElementById('new-pwd').value;
  var el=document.getElementById('pwd-msg');
  if(!cur){el.textContent='请输入当前密码';el.className='toast err';return}
  if(pw.length<6){el.textContent='新密码至少6位';el.className='toast err';return}
  var resp=await fetch('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:cur,newPassword:pw})});
  var data=await resp.json();
  if(data.ok){el.textContent='✓ 密码已更新';el.className='toast ok'}
  else{el.textContent=data.error||'失败';el.className='toast err'}
}

load();
</script>
</body>
</html>
