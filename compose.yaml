services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CLIPTALK_BIND_ADDRESS:-0.0.0.0}:${CLIPTALK_HTTP_PORT:-8000}:8000"
    environment:
      CLIPTALK_DATA_DIR: /data
      CLIPTALK_PORT: "8000"
    volumes:
      - "${CLIPTALK_DATA_PATH:-./data}:/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
